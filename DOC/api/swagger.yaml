openapi: 3.0.4
info:
  title: CloudInn API
  description: |-
    API do sistema interno hoteleiro CloudInn.
    Responsável pelo gerenciamento de reservas, hóspedes e quartos, incluindo o fluxo completo de CRUD
    (POST, GET, PUT e DELETE) para os principais recursos do sistema e as operações específicas de
    check-in e check-out descritas na arquitetura (RF01 a RF11).

    O contrato considera os três principais dados persistidos descritos na arquitetura do sistema:
    Reserva, Hóspede e Quarto.
  version: 1.1.0
servers:
  - url: https://api.cloudinn.internal/v1

tags:
  - name: reservation
    description: Gerenciamento de reservas, notificações externas, check-in e check-out
  - name: room
    description: Cadastro, consulta, atualização e remoção de quartos e controle de seus status
  - name: guest
    description: Cadastro, consulta, atualização e remoção de hóspedes

paths:
  /reservation:
    get:
      tags:
        - reservation
      summary: Lista as reservas do sistema
      description: Retorna as reservas cadastradas. Permite filtrar pelo status da reserva.
      operationId: getReservations
      parameters:
        - name: status
          in: query
          description: Filtra reservas por status
          required: false
          schema:
            type: string
            enum:
              - pending
              - active
              - completed
              - cancelled
      responses:
        "200":
          description: Reservas retornadas com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

    post:
      tags:
        - reservation
      summary: Registra uma nova reserva
      description: |-
        Recebe os dados necessários para cadastrar uma reserva e relacioná-la ao hóspede e ao quarto,
        atendendo ao recebimento de notificações externas e ao registro de reservas (RF01, RF03, RF04, RF05).
      operationId: createReservation
      requestBody:
        $ref: "#/components/requestBodies/ReservationBody"
      responses:
        "201":
          description: Reserva registrada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Dados inválidos fornecidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

  /reservation/{reservationId}:
    get:
      tags:
        - reservation
      summary: Busca uma reserva pelo ID
      description: Retorna uma única reserva a partir de seu identificador.
      operationId: getReservationById
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Reserva retornada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reserva não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

    put:
      tags:
        - reservation
      summary: Atualiza uma reserva existente
      description: |-
        Atualiza os dados de uma reserva existente, incluindo hóspede, quarto, datas de check-in/check-out
        e status quando esses dados estiverem presentes no recurso enviado.
      operationId: updateReservation
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      requestBody:
        $ref: "#/components/requestBodies/ReservationBody"
      responses:
        "200":
          description: Reserva atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: ID ou dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reserva não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

    delete:
      tags:
        - reservation
      summary: Exclui uma reserva
      description: Remove a reserva correspondente ao identificador informado.
      operationId: deleteReservation
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Reserva excluída com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reserva não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

  /reservation/{reservationId}/checkin:
    post:
      tags:
        - reservation
      summary: Registra o check-in da reserva
      description: Registra o check-in do hóspede e atualiza o status do quarto para ocupado (RF07).
      operationId: registerCheckIn
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Check-in realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reserva não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Status inválido para check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

  /reservation/{reservationId}/checkout:
    post:
      tags:
        - reservation
      summary: Registra o check-out da reserva
      description: Registra o check-out do hóspede e altera o status do quarto para sujo (RF08, RF09).
      operationId: registerCheckOut
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Check-out realizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reserva não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

  /room:
    get:
      tags:
        - room
      summary: Lista todos os quartos
      description: Permite visualizar os quartos e seus respectivos status.
      operationId: getRooms
      parameters:
        - name: status
          in: query
          description: Status do quarto para filtro
          required: false
          schema:
            type: string
            enum:
              - available
              - reserved
              - occupied
              - dirty
              - cleaning
      responses:
        "200":
          description: Quartos retornados com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

    post:
      tags:
        - room
      summary: Cadastra um novo quarto
      description: Cadastra um quarto no sistema com número, tipo e status atual.
      operationId: createRoom
      requestBody:
        $ref: "#/components/requestBodies/RoomBody"
      responses:
        "201":
          description: Quarto cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

  /room/{roomId}:
    get:
      tags:
        - room
      summary: Busca informações de um quarto pelo ID
      description: Retorna um único quarto e seu status atual.
      operationId: getRoomById
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Quarto retornado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Quarto não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

    put:
      tags:
        - room
      summary: Atualiza os dados de um quarto
      description: |-
        Atualiza os dados do quarto. A atualização do campo status atende ao controle de reservado,
        ocupado, sujo, em limpeza e disponível (RF06, RF10, RF11).
      operationId: updateRoom
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        $ref: "#/components/requestBodies/RoomBody"
      responses:
        "200":
          description: Quarto atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: ID ou dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Quarto não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

    delete:
      tags:
        - room
      summary: Exclui um quarto
      description: Remove o quarto correspondente ao identificador informado.
      operationId: deleteRoom
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Quarto excluído com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Quarto não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

  /guest:
    get:
      tags:
        - guest
      summary: Lista os hóspedes cadastrados
      description: Retorna os hóspedes cadastrados no sistema.
      operationId: getGuests
      responses:
        "200":
          description: Hóspedes retornados com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

    post:
      tags:
        - guest
      summary: Cadastra os dados de um novo hóspede
      description: Registra os dados do hóspede no sistema (RF02).
      operationId: createGuest
      requestBody:
        $ref: "#/components/requestBodies/GuestBody"
      responses:
        "201":
          description: Hóspede cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

  /guest/{guestId}:
    get:
      tags:
        - guest
      summary: Busca um hóspede pelo ID
      description: Retorna um único hóspede a partir de seu identificador.
      operationId: getGuestById
      parameters:
        - $ref: "#/components/parameters/GuestId"
      responses:
        "200":
          description: Hóspede retornado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Hóspede não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

    put:
      tags:
        - guest
      summary: Atualiza os dados de um hóspede
      description: Atualiza os dados do hóspede correspondente ao identificador informado.
      operationId: updateGuest
      parameters:
        - $ref: "#/components/parameters/GuestId"
      requestBody:
        $ref: "#/components/requestBodies/GuestBody"
      responses:
        "200":
          description: Hóspede atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          description: ID ou dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Hóspede não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

    delete:
      tags:
        - guest
      summary: Exclui um hóspede
      description: Remove o hóspede correspondente ao identificador informado.
      operationId: deleteGuest
      parameters:
        - $ref: "#/components/parameters/GuestId"
      responses:
        "200":
          description: Hóspede excluído com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Hóspede não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Erro inesperado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - api_key: []

components:
  schemas:
    Reservation:
      type: object
      required:
        - guest
        - checkInDate
        - checkOutDate
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 10
        guest:
          $ref: "#/components/schemas/Guest"
        room:
          $ref: "#/components/schemas/Room"
        checkInDate:
          type: string
          format: date-time
          example: "2026-09-01T14:00:00Z"
        checkOutDate:
          type: string
          format: date-time
          example: "2026-09-05T12:00:00Z"
        status:
          type: string
          description: Status da reserva
          example: active
          enum:
            - pending
            - active
            - completed
            - cancelled

    Guest:
      type: object
      required:
        - name
        - document
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        name:
          type: string
          example: João Silva
        email:
          type: string
          example: joao.silva@email.com
        document:
          type: string
          description: Documento de identificação (CPF, Passaporte)
          example: 123.456.789-00
        phone:
          type: string
          example: "+5541999999999"

    Room:
      type: object
      required:
        - number
        - roomType
        - status
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 101
        number:
          type: string
          description: Número do quarto
          example: 101A
        roomType:
          type: string
          description: Sigla/tipo do quarto
          example: STD
        status:
          type: string
          description: Status atual do quarto
          example: available
          enum:
            - available
            - reserved
            - occupied
            - dirty
            - cleaning

    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 200
        type:
          type: string
          example: success
        message:
          type: string
          example: Operação realizada com sucesso

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dados inválidos fornecidos

  parameters:
    ReservationId:
      name: reservationId
      in: path
      description: ID da reserva
      required: true
      schema:
        type: integer
        format: int64

    RoomId:
      name: roomId
      in: path
      description: ID do quarto
      required: true
      schema:
        type: integer
        format: int64

    GuestId:
      name: guestId
      in: path
      description: ID do hóspede
      required: true
      schema:
        type: integer
        format: int64

  requestBodies:
    ReservationBody:
      description: Dados da reserva
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Reservation"

    RoomBody:
      description: Dados do quarto
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Room"

    GuestBody:
      description: Dados do hóspede
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Guest"

  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: header
