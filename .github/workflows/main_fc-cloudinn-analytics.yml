# Deploy da Azure Function analítica (fc-cloudInn-analytics).
# Gerado pelo Azure e ajustado: o projeto fica em backend/api/functions/analytics-function (não na raiz do repo).

name: function fc-cloudInn-analytics CI/CD

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/api/functions/analytics-function/**'
      - '.github/workflows/main_fc-cloudinn-analytics.yml'
  workflow_dispatch:

concurrency:
  group: deploy-analytics-function
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'backend/api/functions/analytics-function'
  NODE_VERSION: '24.x'   # mesma versão escolhida na Function App

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/package-lock.json

      - name: 'Instalar dependências e rodar testes'
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          npm ci
          npm test
          npm prune --omit=dev

      - name: Zip artifact for deployment
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: zip -r "$GITHUB_WORKSPACE/release.zip" . -x "local.settings.json" "test/*" ".gitignore" "README.md"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # required for requesting the JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: |
          unzip -q release.zip -d app
          rm release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_81F569D138C4447B98395F29667369B1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7028123D42124C809540EA48D544C2CB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_ED487EFC693D41C8B31752D9475C7001 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'fc-cloudInn-analytics'
          slot-name: 'Production'
          package: app